apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: kubeserve
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: kubeserve
spec:
  # NodePort so the benchmark client on the host can reach it via kind's port mapping.
  type: NodePort
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
