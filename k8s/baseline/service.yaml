apiVersion: v1
kind: Service
metadata:
  name: baseline
  namespace: kubeserve
  labels:
    app.kubernetes.io/name: baseline
    app.kubernetes.io/part-of: kubeserve
spec:
  type: NodePort
  selector:
    app: baseline
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30081
